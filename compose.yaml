name: soleline

x-backend: &backend
  image: ${BACKEND_IMAGE:-soleline-backend:local}
  build: ./backend
  init: true
  restart: unless-stopped
  environment:
    DEBUG: ${DEBUG:-true}
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    DATABASE_URL: ${DATABASE_URL:-postgresql://soleline:${POSTGRES_PASSWORD}@postgres:5432/soleline}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    SITE_URL: ${SITE_URL:-http://localhost:8080}
    TRUST_PROXY: ${TRUST_PROXY:-false}
    TIME_ZONE: ${TIME_ZONE:-Africa/Nairobi}
    CURRENCY: ${CURRENCY:-KES}
    TEST_PAYMENTS: ${TEST_PAYMENTS:-false}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-demo@localhost}
    DEMO_ASSETS_DIR: /demo-assets
    USE_S3: ${USE_S3:-false}
    AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
    AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
    AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
    AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_QUERYSTRING_AUTH: ${AWS_QUERYSTRING_AUTH:-false}
  volumes:
    - media:/app/media
    - static:/app/staticfiles
    - ./frontend/public/images:/demo-assets:ro
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: soleline
      POSTGRES_USER: soleline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U soleline -d soleline]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
  init:
    <<: *backend
    restart: "no"
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py setup_roles && python manage.py collectstatic --noinput"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  backend:
    <<: *backend
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request, urllib.parse; request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': urllib.parse.urlsplit(os.environ['SITE_URL']).netloc, 'X-Forwarded-Proto': 'https' if os.environ.get('TRUST_PROXY') == 'true' else 'http'}); urllib.request.urlopen(request, timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    <<: *backend
    command: [celery, -A, config, worker, --loglevel=info, --hostname=worker@%h]
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping --destination=worker@$$HOSTNAME --timeout=5']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
  beat:
    <<: *backend
    command: [celery, -A, config, beat, --loglevel=info, --schedule=/app/beat/celerybeat-schedule]
    volumes:
      - media:/app/media
      - static:/app/staticfiles
      - beat_data:/app/beat
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    image: ${FRONTEND_IMAGE:-soleline-frontend:local}
    build:
      context: ./frontend
      args:
        INTERNAL_API_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:8080}
    init: true
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:8080}
      MEDIA_ORIGIN: ${MEDIA_ORIGIN:-}
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["${PROXY_BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"]
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx-locations.conf:/etc/nginx/soleline-locations.conf:ro
      - media:/media:ro
      - static:/static:ro
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/nginx-health]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  media:
  static:
  beat_data:
