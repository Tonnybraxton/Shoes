name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: soleline
          POSTGRES_USER: soleline
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U soleline -d soleline"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "true"
      SECRET_KEY: ci-only-secret-for-isolated-tests-change-before-any-real-deployment-2026
      DATABASE_URL: postgresql://soleline:ci-only-postgres-password@127.0.0.1:5432/soleline
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      TEST_PAYMENTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py setup_roles
      - run: python manage.py check
      - run: python -m pytest -q
      - name: Production settings checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "false"
          TEST_PAYMENTS: "false"
          TRUST_PROXY: "true"
          SITE_URL: https://shop.example.com
          ALLOWED_HOSTS: shop.example.com
          CSRF_TRUSTED_ORIGINS: https://shop.example.com
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  containers-and-browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      SECRET_KEY: ci-only-secret-for-isolated-tests-change-before-any-real-deployment-2026
      DEBUG: "true"
      TEST_PAYMENTS: "true"
      SITE_URL: http://localhost:8080
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate production Compose
        run: docker compose -f compose.yaml -f infrastructure/compose.production.yaml config --quiet
        env:
          SITE_URL: https://shop.example.com
          ALLOWED_HOSTS: shop.example.com
          CSRF_TRUSTED_ORIGINS: https://shop.example.com
          EMAIL_HOST: smtp.example.com
          DEFAULT_FROM_EMAIL: orders@example.com
          TLS_CERT_DIR: /tmp/soleline-ci-tls
      - name: Build and start complete stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Validate nginx, database health and demo assets
        run: |
          docker compose exec -T proxy nginx -t
          docker compose exec -T backend python manage.py seed_demo
          curl --fail --silent --show-error http://localhost:8080/api/v1/health/
          curl --fail --silent --show-error http://localhost:8080/static/admin/css/base.css --output /dev/null
          curl --fail --silent --show-error http://localhost:8080/media/demo/hero.png --output /dev/null
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser, commerce and accessibility checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose.log
      - name: Upload browser and container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-and-container-results
          path: |
            artifacts/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Shut down isolated CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans
