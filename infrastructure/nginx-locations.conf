# Included in the HTTP development server and HTTPS production server.
# Forwarding headers are set by this proxy, never copied from the client.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;

location = /nginx-health {
    access_log off;
    return 200 "ok\n";
}
location /api/ {
    proxy_pass http://backend:8000;
    proxy_no_cache 1;
}
location /admin/ {
    proxy_pass http://backend:8000;
    proxy_no_cache 1;
}
location /static/ { alias /static/; expires 7d; }
location /media/ { alias /media/; expires 1d; }
location / {
    proxy_pass http://frontend:3000;
    proxy_buffering off;
}
