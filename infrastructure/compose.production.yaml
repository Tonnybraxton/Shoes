# Run from the repository root with compose.yaml first. Never use this file alone.
x-production-environment: &production-environment
  DEBUG: "false"
  TEST_PAYMENTS: "false"
  TRUST_PROXY: "true"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set the production hostname}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set the production HTTPS origin}
  SITE_URL: ${SITE_URL:?Set the production HTTPS origin}
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: ${EMAIL_HOST:?Set the SMTP host}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set the verified sender}

services:
  init:
    environment: *production-environment
  backend:
    environment: *production-environment
  worker:
    environment: *production-environment
  beat:
    environment: *production-environment
  proxy:
    ports:
      - "${PROXY_BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set an absolute directory with fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
